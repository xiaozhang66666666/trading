<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSS 登录</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fb; color: #1f2937; margin: 0; }
    .wrap { max-width: 420px; margin: 8vh auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
    h1 { margin: 0 0 16px; font-size: 22px; }
    .err { color: #b91c1c; min-height: 22px; margin-bottom: 8px; }
    label { font-size: 14px; display: block; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px; }
    button { margin-top: 14px; width: 100%; border: none; border-radius: 8px; padding: 10px; background: #0f766e; color: #fff; font-weight: 600; }
    p { font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Market Signal System</h1>
    <p>请输入后台预置账号登录。</p>
    <div class="err">{{ error }}</div>
    <form method="post" action="/login">
      <input name="csrf_token" type="hidden" value="{{ csrf_token }}" />
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" required autofocus />

      <label for="password">密码</label>
      <input id="password" name="password" type="password" required />

      <button type="submit">登录</button>
    </form>
  </div>
</body>
</html>
